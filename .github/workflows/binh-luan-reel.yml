name: Bình luận link bài lên Reel của Page

# Facebook không cho bình luận lên Reel đang hẹn giờ, nên link bài (bình luận đầu tiên của Page)
# được đăng ở job này, sau giờ đăng 19:30. Ghép Reel với video/<thư mục>/post.json bằng caption;
# Reel đã có bình luận của Page thì bỏ qua, nên chạy lại không bình luận lặp.
# Chạy theo lịch chỉ khi biến repo BINH_LUAN_REEL = on (đặt sau khi token đã có quyền
# pages_manage_engagement và đã thử chạy tay một lần). Chạy tay luôn được; dry_run mặc định
# true = chỉ liệt kê.
on:
  schedule:
    - cron: "20 13,15 * * *" # 20:20 và 22:20 giờ VN, sau giờ đăng 19:30
    - cron: "20 1 * * *" # 08:20 giờ VN, bù khi lượt tối chưa chạy
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Chỉ liệt kê Reel sẽ bình luận, không đăng"
        required: false
        type: boolean
        default: true
      ngay:
        description: "Chỉ xét Reel tải lên trong N ngày gần đây"
        required: false
        type: string
        default: "60"

permissions:
  contents: read

jobs:
  binh-luan:
    if: github.event_name != 'schedule' || vars.BINH_LUAN_REEL == 'on'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Bình luận
        env:
          # Input đi qua env, không nội suy vào dòng lệnh shell.
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_NGAY: ${{ inputs.ngay }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: https://bsquyen.vercel.app
          FB_API_VERSION: v26.0
        run: node scripts/binh-luan-reel.mjs
