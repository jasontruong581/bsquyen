<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Ba thẻ so sánh: cảm giác vướng ở cổ nhưng ăn vẫn trôi thì đi khám nếu kéo dài; ợ nóng, nuốt rát thường do trào ngược thì nên khám tiêu hoá; nuốt nghẹn tăng dần từ đồ cứng đến đồ lỏng thì cần nội soi sớm">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- thẻ 1: cảm giác vướng ở cổ (globus) — lòng ống thông, thức ăn vẫn trôi -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <rect x="108" y="50" width="50" height="112" rx="18" fill="#f2a56e" stroke="#e08b4f" stroke-width="4"/>
  <rect x="121" y="50" width="24" height="112" fill="#fdeee2"/>
  <!-- cảm giác "có cục" — vòng nét đứt, không phải vật thật -->
  <circle cx="133" cy="88" r="20" fill="none" stroke="#5b6b7b" stroke-width="3" stroke-dasharray="6 5"/>
  <!-- thức ăn vẫn trôi xuống -->
  <circle cx="133" cy="138" r="8" fill="#f26e21"/>
  <path d="M184 100 v40 m-9 -10 l9 10 l9 -10" fill="none" stroke="#123b63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Vướng ở cổ</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Ăn vẫn trôi, hay khi lo âu</text>
  <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Khám nếu kéo dài</text>

  <!-- thẻ 2: ợ nóng, nuốt rát — ngọn lửa trong thực quản -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <rect x="355" y="50" width="50" height="112" rx="18" fill="#f2a56e" stroke="#e08b4f" stroke-width="4"/>
  <rect x="368" y="50" width="24" height="112" fill="#fdeee2"/>
  <path d="M380 148 c-16 0 -22 -14 -16 -26 c3 8 8 10 10 8 c-4 -14 2 -26 12 -32 c-2 10 4 16 8 22 c5 8 4 28 -14 28 Z"
        fill="#f26e21" stroke="#d85a10" stroke-width="3" stroke-linejoin="round"/>
  <text x="380" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Ợ nóng, nuốt rát</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Thường do trào ngược</text>
  <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Nên khám tiêu hoá</text>

  <!-- thẻ 3 (nhấn): nghẹn tăng dần — lòng ống bị hẹp -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <rect x="580" y="50" width="50" height="112" rx="18" fill="#f2a56e" stroke="#e08b4f" stroke-width="4"/>
  <rect x="593" y="50" width="24" height="112" fill="#fdeee2"/>
  <path d="M593 82 q18 24 0 48 Z" fill="#f26e21" stroke="#d85a10" stroke-width="3" stroke-linejoin="round"/>
  <path d="M617 82 q-18 24 0 48 Z" fill="#f26e21" stroke="#d85a10" stroke-width="3" stroke-linejoin="round"/>
  <!-- chuông cảnh báo nhỏ -->
  <path d="M674 70 a20 20 0 0 1 20 20 v16 l7 11 h-54 l7 -11 v-16 a20 20 0 0 1 20 -20 Z"
        fill="#f26e21" stroke="#d85a10" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="674" cy="125" r="6" fill="#d85a10"/>
  <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Nghẹn tăng dần</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Cứng, rồi mềm, rồi lỏng</text>
  <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Cần nội soi sớm</text>
</svg>
