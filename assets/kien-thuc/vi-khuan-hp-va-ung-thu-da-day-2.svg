<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" font-family="'Be Vietnam Pro', system-ui, sans-serif" aria-label="Ba bước xử trí nhiễm vi khuẩn HP: xét nghiệm bằng test hơi thở, xét nghiệm phân hoặc nội soi; điều trị đủ đợt theo phác đồ bác sĩ chỉ định; kiểm tra lại sau điều trị để xác nhận đã sạch HP">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Thẻ 1: Xét nghiệm -->
  <g>
    <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- ống nghiệm -->
    <g transform="rotate(-12 133 105)">
      <rect x="113" y="52" width="40" height="105" rx="20" fill="#e8f1fa" stroke="#123b63" stroke-width="6"/>
      <path d="M116 105 h34 v32 a17 17 0 0 1 -34 0 Z" fill="#f26e21"/>
      <rect x="107" y="44" width="52" height="16" rx="7" fill="#123b63"/>
    </g>
    <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Xét nghiệm HP</text>
    <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">test hơi thở, phân, nội soi</text>
    <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Biết mình có nhiễm</text>
  </g>

  <!-- Thẻ 2: Điều trị đủ đợt -->
  <g>
    <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- viên nang thuốc -->
    <g transform="rotate(-35 380 105)">
      <rect x="325" y="80" width="110" height="50" rx="25" fill="#ffffff" stroke="#d85a10" stroke-width="5"/>
      <path d="M380 82.5 h-30 a22.5 22.5 0 0 0 0 45 h30 Z" fill="#f26e21"/>
      <circle cx="345" cy="96" r="5" fill="#ffd9bd"/>
    </g>
    <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Điều trị đủ đợt</text>
    <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">phác đồ do bác sĩ chỉ định</text>
    <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Không tự ý bỏ thuốc</text>
  </g>

  <!-- Thẻ 3: Kiểm tra lại -->
  <g>
    <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
    <!-- kính lúp + dấu tích -->
    <circle cx="615" cy="98" r="40" fill="#ffffff" stroke="#123b63" stroke-width="9"/>
    <path d="M598 98 l12 12 l22 -24" fill="none" stroke="#f26e21" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M644 127 l26 26" stroke="#123b63" stroke-width="16" stroke-linecap="round"/>
    <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Kiểm tra lại</text>
    <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">vài tuần sau khi hết thuốc</text>
    <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Xác nhận đã sạch HP</text>
  </g>
</svg>
