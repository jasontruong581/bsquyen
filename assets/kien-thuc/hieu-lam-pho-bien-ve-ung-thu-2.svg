<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Ba thẻ nêu ba câu hỏi kiểm chứng thông tin về ung thư: ai đưa tin, có bằng chứng nghiên cứu hay chỉ lời kể, và thông tin đó có đòi dừng điều trị hay mua hàng không">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Thẻ 1: AI ĐƯA TIN -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- icon: người + bong bóng thoại -->
  <circle cx="124" cy="82" r="23" fill="#f26e21" stroke="#d85a10" stroke-width="5"/>
  <path d="M89 148 a35 35 0 0 1 70 0 Z" fill="#f26e21" stroke="#d85a10"
        stroke-width="5" stroke-linejoin="round"/>
  <rect x="160" y="52" width="52" height="38" rx="12" fill="#ffffff"
        stroke="#d85a10" stroke-width="4"/>
  <path d="M172 90 v13 l14 -13 Z" fill="#ffffff" stroke="#d85a10"
        stroke-width="4" stroke-linejoin="round"/>
  <text x="186" y="79" text-anchor="middle" font-size="24" font-weight="800"
        fill="#f26e21">?</text>
  <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700"
        fill="#123b63">Ai đưa tin?</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Bác sĩ hay người bán?</text>
  <text x="133" y="272" text-anchor="middle" font-size="18" font-weight="700"
        fill="#d85a10">Xem nguồn gốc</text>

  <!-- Thẻ 2: CÓ BẰNG CHỨNG -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- icon: tài liệu nghiên cứu + dấu tích -->
  <rect x="341" y="50" width="78" height="100" rx="9" fill="#ffffff"
        stroke="#d85a10" stroke-width="5"/>
  <g stroke="#f26e21" stroke-width="6" stroke-linecap="round">
    <path d="M358 76 h44"/>
    <path d="M358 96 h44"/>
    <path d="M358 116 h26"/>
  </g>
  <circle cx="421" cy="140" r="19" fill="#f26e21"/>
  <path d="M412 140 l7 8 l12 -14" fill="none" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="205" text-anchor="middle" font-size="22" font-weight="700"
        fill="#123b63">Có bằng chứng?</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Nghiên cứu hay lời kể?</text>
  <text x="380" y="272" text-anchor="middle" font-size="18" font-weight="700"
        fill="#d85a10">Tìm nghiên cứu</text>

  <!-- Thẻ 3: CÓ ĐÒI GÌ KHÔNG — thẻ nhấn, cột cần hành động -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <!-- icon: chuông cảnh báo (chép từ references/minh-hoa.md, tâm x=627) -->
  <path d="M627 60 a34 34 0 0 1 34 34 v28 l12 18 h-92 l12 -18 v-28 a34 34 0 0 1 34 -34 Z"
        fill="#f26e21" stroke="#d85a10" stroke-width="5"/>
  <circle cx="627" cy="150" r="10" fill="#d85a10"/>
  <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700"
        fill="#123b63">Có đòi gì không?</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Dừng thuốc, mua hàng?</text>
  <text x="627" y="272" text-anchor="middle" font-size="18" font-weight="700"
        fill="#d85a10">Hỏi bác sĩ ngay</text>
</svg>
