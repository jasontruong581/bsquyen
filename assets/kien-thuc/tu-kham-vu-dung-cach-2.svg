<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Ba bước tự khám vú: nhìn trước gương để xem hình dạng, da và núm vú ở tư thế tay xuôi rồi giơ cao; sờ bằng ba ngón tay theo vòng tròn nhỏ với ba mức lực, gồm cả vùng nách; và khi thấy khối, lõm da hay tiết dịch thì đi khám, không chờ đợi" font-family="'Be Vietnam Pro', system-ui, sans-serif">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- thẻ 1: nhìn trước gương -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- icon: gương đứng có tia phản chiếu -->
  <rect x="93" y="48" width="80" height="106" rx="40" fill="#e8f1fa" stroke="#123b63" stroke-width="6"/>
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round">
    <path d="M113 86 l18 -18"/>
    <path d="M115 108 l32 -32"/>
  </g>
  <path d="M133 154 v14 M113 170 h40" stroke="#123b63" stroke-width="6" stroke-linecap="round"/>
  <circle cx="150" cy="122" r="9" fill="#f26e21"/>
  <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Nhìn trước gương</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Hình dạng, da, núm vú</text>
  <text x="133" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Tay xuôi rồi giơ cao</text>

  <!-- thẻ 2: sờ bằng ba ngón -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- icon: ba ngón tay + vòng xoay nhỏ -->
  <circle cx="380" cy="112" r="40" fill="none" stroke="#f2a56e" stroke-width="9"/>
  <g stroke="#d85a10" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M360 96 l-8 24"/>
    <path d="M380 89 l0 26"/>
    <path d="M400 96 l8 24"/>
  </g>
  <circle cx="360" cy="96" r="8" fill="#f26e21"/>
  <circle cx="380" cy="89" r="8" fill="#f26e21"/>
  <circle cx="400" cy="96" r="8" fill="#f26e21"/>
  <text x="380" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Sờ bằng ba ngón</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Xoay tròn, ấn ba mức lực</text>
  <text x="380" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Gồm cả vùng nách</text>

  <!-- thẻ 3: thấy khác lạ -> đi khám (thẻ nhấn) -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <!-- icon: chuông cảnh báo -->
  <path d="M627 60 a34 34 0 0 1 34 34 v28 l12 18 h-92 l12 -18 v-28 a34 34 0 0 1 34 -34 Z"
        fill="#f26e21" stroke="#d85a10" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="627" cy="151" r="10" fill="#d85a10"/>
  <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Thấy khác lạ</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Khối, lõm da, tiết dịch</text>
  <text x="627" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Đi khám, đừng chờ</text>

  <text x="380" y="313" text-anchor="middle" font-size="12" fill="#5b6b7b">*Còn kinh: vài ngày sau khi sạch kinh · Đã mãn kinh: một ngày cố định mỗi tháng</text>
</svg>
