<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Ba khái niệm hay bị gộp làm một: quen thuốc, lệ thuộc thể chất và nghiện">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Thẻ 1 — Quen thuốc -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- Ba viên thuốc lớn dần: cần liều cao hơn để đạt hiệu quả như cũ -->
  <g stroke-linecap="round">
    <circle cx="76" cy="103" r="16" fill="#fdeee2" stroke="#f2a56e" stroke-width="4"/>
    <path d="M76 95 V111" stroke="#f2a56e" stroke-width="3"/>
    <circle cx="122" cy="103" r="22" fill="#f2a56e" stroke="#e08b4f" stroke-width="4"/>
    <path d="M122 92 V114" stroke="#ffffff" stroke-width="4"/>
    <circle cx="176" cy="103" r="29" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
    <path d="M176 88 V118" stroke="#ffffff" stroke-width="5"/>
  </g>
  <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Quen thuốc</text>
  <text x="133" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">Cơ thể đáp ứng kém dần</text>
  <text x="133" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Bác sĩ chỉnh liều</text>

  <!-- Thẻ 2 — Lệ thuộc thể chất -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- Ba cột thấp dần + mũi tên đứt: giảm liều từ từ, không ngừng đột ngột -->
  <path d="M336 54 Q392 54 424 102" fill="none" stroke="#5b6b7b" stroke-width="3"
        stroke-dasharray="7 8" stroke-linecap="round"/>
  <path d="M412 94 L430 105 L414 114 Z" fill="#5b6b7b"/>
  <g stroke-width="3">
    <rect x="333" y="65" width="26" height="80" rx="8" fill="#f26e21" stroke="#d85a10"/>
    <rect x="367" y="95" width="26" height="50" rx="8" fill="#f2a56e" stroke="#e08b4f"/>
    <rect x="401" y="120" width="26" height="25" rx="8" fill="#fdeee2" stroke="#f2a56e"/>
  </g>
  <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Lệ thuộc thể chất</text>
  <text x="380" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">Ngừng đột ngột khó chịu</text>
  <text x="380" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Giảm liều từ từ</text>

  <!-- Thẻ 3 — Nghiện (thẻ nhấn: đây là thứ mọi người đang sợ) -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <!-- Người với viên thuốc chiếm lấy tâm trí -->
  <path d="M575 160 a52 52 0 0 1 104 0 Z" fill="#123b63"/>
  <circle cx="627" cy="78" r="31" fill="#123b63"/>
  <g transform="rotate(-25 627 78)">
    <rect x="604" y="65" width="46" height="26" rx="13" fill="#f26e21"/>
    <path d="M627 67 V89" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Nghiện</text>
  <text x="627" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">Dùng bất chấp hậu quả</text>
  <text x="627" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Hiếm khi dùng đúng</text>

  <text x="380" y="313" text-anchor="middle" font-size="12" fill="#5b6b7b">*Phân biệt theo Viện Ung thư Quốc gia Hoa Kỳ (NCI)</text>
</svg>
