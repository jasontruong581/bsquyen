<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"
     aria-label="Hai bong bóng thoại đối lập, một gắn dấu gạch chéo và một gắn dấu tích, phía dưới là một viên thuốc">
  <!-- Bản không chữ của -1.svg, dùng làm ảnh card 200x125 -->
  <rect width="760" height="440" fill="#fff9f4"/>
  <circle cx="700" cy="392" r="104" fill="#fdeee2"/>
  <circle cx="44" cy="44" r="70" fill="#e8f1fa"/>

  <!-- Bong bóng SAI -->
  <rect x="56" y="60" width="300" height="180" rx="30" fill="#e8f1fa" stroke="#5b6b7b" stroke-width="5"/>
  <path d="M108 240 v40 l46 -40 Z" fill="#e8f1fa" stroke="#5b6b7b" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#5b6b7b" opacity=".32">
    <rect x="92" y="122" width="212" height="18" rx="9"/>
    <rect x="92" y="158" width="232" height="18" rx="9"/>
    <rect x="92" y="194" width="152" height="18" rx="9"/>
  </g>
  <circle cx="330" cy="92" r="34" fill="#5b6b7b"/>
  <path d="M317 79 l26 26 M343 79 l-26 26" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>

  <!-- Bong bóng ĐÚNG -->
  <rect x="404" y="60" width="300" height="180" rx="30" fill="#fdeee2" stroke="#f2a56e" stroke-width="5"/>
  <path d="M652 240 v40 l-46 -40 Z" fill="#fdeee2" stroke="#f2a56e" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#f2a56e" opacity=".55">
    <rect x="440" y="122" width="212" height="18" rx="9"/>
    <rect x="440" y="158" width="232" height="18" rx="9"/>
    <rect x="440" y="194" width="152" height="18" rx="9"/>
  </g>
  <circle cx="678" cy="92" r="34" fill="#f26e21"/>
  <path d="M663 92 l12 13 l21 -25" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

