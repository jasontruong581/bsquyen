  <circle cx="700" cy="390" r="130" fill="#fdeee2"/>
  <circle cx="60" cy="70" r="100" fill="#e8f1fa"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M130 95 H430 Q560 95 560 200 V250 Q560 310 470 320 Q390 330 390 360 V385"
          stroke="#e08b4f" stroke-width="88"/>
    <path d="M130 95 H430 Q560 95 560 200 V250 Q560 310 470 320 Q390 330 390 360 V385"
