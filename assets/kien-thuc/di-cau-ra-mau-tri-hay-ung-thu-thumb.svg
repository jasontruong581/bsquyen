    <path d="M130 95 H430 Q560 95 560 200 V250 Q560 310 470 320 Q390 330 390 360 V385"
          stroke="#fdeee2" stroke-width="38"/>
  </g>

  <!-- Nguồn cao: khối u / polyp -->
  <circle cx="560" cy="215" r="30" fill="#f26e21" stroke="#d85a10" stroke-width="8"/>
  <circle cx="550" cy="205" r="8" fill="#ffd9bd"/>

  <!-- Nguồn thấp: cụm trĩ -->
  <g fill="#f26e21" stroke="#d85a10" stroke-width="6">
    <circle cx="371" cy="364" r="16"/>
    <circle cx="409" cy="364" r="16"/>
    <circle cx="390" cy="390" r="16"/>
