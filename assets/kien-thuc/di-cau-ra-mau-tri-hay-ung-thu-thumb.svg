<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"
     aria-label="Ống tiêu hoá với hai vị trí chảy máu: một khối trong lòng đại tràng và một cụm ngay ống hậu môn">
  <!-- Bản không chữ dùng cho card danh sách: giữ bố cục của -1.svg, phóng to hình khối -->
