<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Bên trái là lời truyền miệng cho rằng dùng morphin là nghiện, bên phải là thực tế y khoa xem morphin là thuốc giảm đau có chuẩn mực">
  <!-- Nền + khối trang trí (layout E: khối lệch nhẹ so với khung chung) -->
  <rect width="760" height="440" fill="#fff9f4"/>
  <circle cx="700" cy="392" r="104" fill="#fdeee2"/>
  <circle cx="44" cy="44" r="70" fill="#e8f1fa"/>

  <!-- Bong bóng SAI — lời truyền miệng -->
  <rect x="48" y="64" width="280" height="170" rx="26" fill="#e8f1fa" stroke="#5b6b7b" stroke-width="3"/>
  <path d="M96 234 v34 l40 -34 Z" fill="#e8f1fa" stroke="#5b6b7b" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#5b6b7b" opacity=".32">
    <rect x="78" y="132" width="196" height="14" rx="7"/>
    <rect x="78" y="162" width="216" height="14" rx="7"/>
    <rect x="78" y="192" width="140" height="14" rx="7"/>
  </g>
  <circle cx="298" cy="98" r="26" fill="#5b6b7b"/>
  <path d="M288 88 l20 20 M308 88 l-20 20" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- Bong bóng ĐÚNG — thực tế y khoa (soi gương bong bóng trái) -->
  <rect x="432" y="64" width="280" height="170" rx="26" fill="#fdeee2" stroke="#f2a56e" stroke-width="3"/>
  <path d="M664 234 v34 l-40 -34 Z" fill="#fdeee2" stroke="#f2a56e" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#f2a56e" opacity=".55">
    <rect x="462" y="132" width="196" height="14" rx="7"/>
    <rect x="462" y="162" width="216" height="14" rx="7"/>
    <rect x="462" y="192" width="140" height="14" rx="7"/>
  </g>
  <circle cx="684" cy="98" r="26" fill="#f26e21"/>
  <path d="M672 98 l9 10 l16 -19" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Nhãn dưới mỗi bong bóng -->
  <text x="188" y="300" text-anchor="middle" font-size="23" font-weight="700" fill="#123b63">Lời truyền miệng</text>
  <text x="188" y="328" text-anchor="middle" font-size="16" fill="#5b6b7b">"Dùng morphin là nghiện"</text>
  <text x="572" y="300" text-anchor="middle" font-size="23" font-weight="700" fill="#123b63">Thực tế y khoa</text>
  <text x="572" y="328" text-anchor="middle" font-size="16" fill="#5b6b7b">Thuốc giảm đau có chuẩn mực</text>

  <!-- Thông điệp chân ảnh: viên thuốc + câu chốt -->
  <rect x="116" y="370" width="56" height="32" rx="16" fill="#ffffff" stroke="#123b63" stroke-width="6"/>
  <path d="M144 373 V399" stroke="#123b63" stroke-width="5" stroke-linecap="round"/>
  <text x="196" y="396" font-size="21" font-weight="700" fill="#123b63">Dùng đúng chỉ định, nguy cơ nghiện thấp</text>
</svg>
