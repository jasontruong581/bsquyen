<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Ba nhóm nguyên nhân gây sụt cân: bệnh tiêu hoá và nội tiết; tâm lý, răng miệng và thuốc; ung thư — khả năng cần được loại trừ">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Thẻ 1: tiêu hoá, nội tiết — ống nghiệm (xét nghiệm cơ bản) -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <rect x="113" y="50" width="40" height="105" rx="20" fill="#e8f1fa" stroke="#123b63" stroke-width="6"/>
  <path d="M119 108 H147 V135 a14 14 0 0 1 -28 0 Z" fill="#f26e21"/>
  <rect x="105" y="42" width="56" height="16" rx="7" fill="#123b63"/>
  <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Tiêu hoá, nội tiết</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Dạ dày, giáp, tiểu đường</text>
  <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Xét nghiệm cơ bản</text>

  <!-- Thẻ 2: tâm lý, răng miệng, thuốc — bong bóng thoại (hỏi bệnh kỹ) -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <g transform="translate(247,0)">
    <rect x="88" y="55" width="90" height="68" rx="16" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
    <path d="M108 121 V145 L134 121" fill="#f26e21" stroke="#d85a10" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
      <path d="M104 78 H162"/>
      <path d="M104 92 H162"/>
      <path d="M104 106 H140"/>
    </g>
  </g>
  <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Tâm lý, thuốc</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Trầm cảm, răng miệng</text>
  <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Hỏi bệnh kỹ</text>

  <!-- Thẻ 3 (nhấn): ung thư — kính lúp soi thấy tổn thương -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <g transform="translate(247,0)">
    <circle cx="372" cy="98" r="38" fill="#ffffff" stroke="#123b63" stroke-width="8"/>
    <circle cx="372" cy="98" r="14" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
    <path d="M398 124 L424 150" stroke="#123b63" stroke-width="14" stroke-linecap="round"/>
  </g>
  <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Ung thư</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Một khả năng trong nhiều</text>
  <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Cần được loại trừ</text>
</svg>
