<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"
     aria-label="Ba chấm tròn lớn dần trên một trục thời gian, phía trên chấm lớn nhất là chiếc cân có kim lệch về phía giảm">
  <rect width="760" height="440" fill="#fff9f4"/>
  <circle cx="690" cy="380" r="110" fill="#fdeee2"/>
  <circle cx="70" cy="65" r="80" fill="#e8f1fa"/>

  <!-- cân sức khoẻ trên mốc cuối, kim lệch trái = cân giảm -->
  <rect x="512" y="40" width="116" height="116" rx="26" fill="#ffffff" stroke="#123b63" stroke-width="8"/>
  <path d="M533 90 a37 37 0 0 1 74 0 Z" fill="#fdeee2" stroke="#f2a56e" stroke-width="5" stroke-linejoin="round"/>
  <path d="M570 90 L552 64" stroke="#f26e21" stroke-width="7" stroke-linecap="round"/>
  <circle cx="570" cy="90" r="7" fill="#d85a10"/>
  <rect x="532" y="112" width="32" height="26" rx="8" fill="#e8f1fa"/>
  <rect x="576" y="112" width="32" height="26" rx="8" fill="#e8f1fa"/>

  <!-- trục thời gian -->
  <path d="M80 260 H640" stroke="#ecdfd3" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M640 236 l44 24 l-44 24 Z" fill="#ecdfd3"/>

  <!-- ba mốc: cân giảm càng nhiều, càng đáng chú ý -->
  <circle cx="170" cy="260" r="34" fill="#fdeee2" stroke="#f2a56e" stroke-width="6"/>
  <circle cx="170" cy="260" r="10" fill="#f2a56e"/>
  <circle cx="370" cy="260" r="44" fill="#f2a56e" stroke="#e08b4f" stroke-width="6"/>
  <circle cx="570" cy="260" r="56" fill="#f26e21" stroke="#d85a10" stroke-width="7"/>
  <circle cx="552" cy="242" r="12" fill="#ffd9bd"/>
</svg>
