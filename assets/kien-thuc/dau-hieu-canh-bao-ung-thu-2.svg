<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Ba thẻ nêu ba đặc điểm của triệu chứng cần được thăm khám: kéo dài trên hai đến ba tuần, nặng dần lên, và chảy máu hoặc sụt cân kèm theo">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Thẻ 1: triệu chứng kéo dài -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <circle cx="133" cy="105" r="48" fill="#ffffff" stroke="#f26e21" stroke-width="6"/>
  <path d="M133 105 V72 M133 105 l26 15" stroke="#123b63" stroke-width="6" stroke-linecap="round" fill="none"/>
  <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Trên 2–3 tuần</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Triệu chứng chưa đỡ</text>
  <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Đặt lịch khám</text>

  <!-- Thẻ 2: nặng dần lên -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <rect x="340" y="125" width="22" height="30" rx="4" fill="#f2a56e"/>
  <rect x="369" y="100" width="22" height="55" rx="4" fill="#f2a56e"/>
  <rect x="398" y="70" width="22" height="85" rx="4" fill="#f26e21"/>
  <path d="M398 60 l11 -12 l11 12" fill="none" stroke="#d85a10" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Nặng dần lên</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Mỗi tuần một nặng hơn</text>
  <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Đi khám sớm</text>

  <!-- Thẻ 3: chảy máu, sụt cân — cột cần hành động ngay -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <path d="M627 60 a34 34 0 0 1 34 34 v28 l12 18 h-92 l12 -18 v-28 a34 34 0 0 1 34 -34 Z"
        fill="#f26e21" stroke="#d85a10" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="627" cy="150" r="10" fill="#d85a10"/>
  <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Chảy máu, sụt cân</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Kèm theo triệu chứng</text>
  <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Đi khám ngay</text>
</svg>
