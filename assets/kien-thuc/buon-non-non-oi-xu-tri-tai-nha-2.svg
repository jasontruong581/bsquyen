<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" font-family="'Be Vietnam Pro', system-ui, sans-serif" aria-label="Ba việc nên làm khi buồn nôn, nôn ói: uống từng ngụm nhỏ nước lọc, nước canh, cả ngày; ăn ít, chia 5 đến 6 bữa nhỏ với món nhạt, nguội; dùng thuốc chống nôn đúng giờ theo đơn bác sĩ, kể cả lúc thấy đỡ">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- thẻ 1: uống từng ngụm -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- ly nước -->
  <path d="M103 60 h60 l-8 96 h-44 Z" fill="#e8f1fa" stroke="#123b63" stroke-width="6" stroke-linejoin="round"/>
  <path d="M107 98 h52 l-5 54 h-42 Z" fill="#f2a56e" opacity=".7"/>
  <path d="M150 52 l18 -14" stroke="#f26e21" stroke-width="7" stroke-linecap="round"/>
  <path d="M150 52 v60" stroke="#f26e21" stroke-width="7" stroke-linecap="round"/>
  <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Uống từng ngụm</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Nước lọc, nước canh</text>
  <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Rải đều cả ngày</text>

  <!-- thẻ 2: ăn ít, nhiều bữa -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- ba chén nhỏ -->
  <g fill="#f2a56e" stroke="#e08b4f" stroke-width="4">
    <path d="M318 110 h44 a22 22 0 0 1 -44 0 Z"/>
    <path d="M358 140 h44 a22 22 0 0 1 -44 0 Z"/>
    <path d="M398 110 h44 a22 22 0 0 1 -44 0 Z"/>
  </g>
  <g fill="#ffd9bd">
    <ellipse cx="340" cy="110" rx="18" ry="5"/>
    <ellipse cx="380" cy="140" rx="18" ry="5"/>
    <ellipse cx="420" cy="110" rx="18" ry="5"/>
  </g>
  <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Ăn ít, nhiều bữa</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Món nhạt, để nguội bớt</text>
  <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">5–6 bữa nhỏ/ngày</text>

  <!-- thẻ 3: thuốc đúng giờ — thẻ nhấn -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <!-- đồng hồ + viên thuốc -->
  <circle cx="602" cy="102" r="44" fill="#ffffff" stroke="#123b63" stroke-width="6"/>
  <path d="M602 102 V74 M602 102 L622 114" stroke="#123b63" stroke-width="6" stroke-linecap="round"/>
  <g transform="rotate(-35 668 138)">
    <rect x="644" y="126" width="48" height="24" rx="12" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
    <path d="M668 128 v20" stroke="#d85a10" stroke-width="4"/>
  </g>
  <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Thuốc đúng giờ</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Theo đơn bác sĩ</text>
  <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Kể cả lúc thấy đỡ</text>
</svg>
