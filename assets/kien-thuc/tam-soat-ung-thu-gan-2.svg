<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Ba nhóm liên quan tầm soát ung thư gan: viêm gan B hoặc C cần giám sát định kỳ, xơ gan cần siêu âm mỗi 6 tháng, chưa từng xét nghiệm thì nên đi xét nghiệm" font-family="'Be Vietnam Pro', system-ui, sans-serif">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Cột 1: Viêm gan B hoặc C -->
  <g>
    <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- virus: thân tròn + gai -->
    <circle cx="133" cy="103" r="34" fill="#f26e21"/>
    <circle cx="124" cy="94" r="7" fill="#ffd9bd"/>
    <g stroke="#d85a10" stroke-width="7" stroke-linecap="round">
      <path d="M133 69 v-16"/><path d="M133 137 v16"/>
      <path d="M99 103 h-16"/><path d="M167 103 h16"/>
      <path d="M109 79 l-11 -11"/><path d="M157 127 l11 11"/>
      <path d="M157 79 l11 -11"/><path d="M109 127 l-11 11"/>
    </g>
    <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Viêm gan B hoặc C</text>
    <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">dù chưa có triệu chứng</text>
    <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Giám sát định kỳ</text>
  </g>

  <!-- Cột 2: Xơ gan -->
  <g>
    <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- gan nhỏ, bề mặt sần (xơ) -->
    <path d="M330 82 Q332 66 352 63 Q392 56 420 66 Q436 72 433 86 Q429 106 408 118
             Q380 132 352 128 Q333 124 330 104 Z"
          fill="#f2a56e" stroke="#e08b4f" stroke-width="4" stroke-linejoin="round"/>
    <g fill="#d85a10" opacity=".55">
      <circle cx="356" cy="86" r="5"/><circle cx="378" cy="79" r="4.5"/>
      <circle cx="398" cy="92" r="5"/><circle cx="372" cy="104" r="4.5"/>
      <circle cx="345" cy="106" r="4"/><circle cx="410" cy="76" r="4"/>
    </g>
    <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Xơ gan</text>
    <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">do rượu, viêm gan, gan mỡ</text>
    <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Siêu âm mỗi 6 tháng</text>
  </g>

  <!-- Cột 3: Chưa xét nghiệm (nhấn) -->
  <g>
    <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
    <!-- ống nghiệm lấy máu -->
    <rect x="607" y="58" width="40" height="105" rx="20" fill="#e8f1fa" stroke="#123b63" stroke-width="6"/>
    <path d="M613 113 h28 v29 a14 14 0 0 1 -28 0 Z" fill="#f26e21"/>
    <rect x="601" y="50" width="52" height="14" rx="7" fill="#123b63"/>
    <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Chưa xét nghiệm?</text>
    <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">chưa từng kiểm tra viêm gan</text>
    <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Nên xét nghiệm 1 lần</text>
  </g>
</svg>
