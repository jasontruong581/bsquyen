<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Ba thẻ theo độ tuổi: trẻ sơ sinh tiêm mũi viêm gan B trong 24 giờ đầu sau sinh; trẻ 9 đến 14 tuổi tiêm vắc-xin HPV trước khi có quan hệ tình dục; người lớn nên xét nghiệm viêm gan B rồi hỏi bác sĩ về tiêm bù">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- thẻ 1: sơ sinh — viêm gan B -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- em bé: đầu tròn trong khăn quấn -->
  <path d="M83 150 Q83 88 133 88 Q183 88 183 150 Z" fill="#fdeee2" stroke="#f2a56e" stroke-width="5" stroke-linejoin="round"/>
  <circle cx="133" cy="92" r="30" fill="#ffd9bd" stroke="#e08b4f" stroke-width="4"/>
  <circle cx="123" cy="90" r="3.5" fill="#123b63"/>
  <circle cx="143" cy="90" r="3.5" fill="#123b63"/>
  <path d="M125 102 q8 6 16 0" fill="none" stroke="#123b63" stroke-width="3" stroke-linecap="round"/>
  <!-- huy hiệu 24 giờ -->
  <circle cx="190" cy="66" r="24" fill="#f26e21"/>
  <text x="190" y="73" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">24h</text>
  <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Trẻ sơ sinh</text>
  <text x="133" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">Vắc-xin viêm gan B</text>
  <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Trong 24 giờ đầu</text>

  <!-- thẻ 2: 9–14 tuổi — HPV -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- vòng tuổi -->
  <circle cx="380" cy="100" r="50" fill="none" stroke="#f2a56e" stroke-width="10"/>
  <text x="380" y="111" text-anchor="middle" font-size="30" font-weight="800" fill="#f26e21">9–14</text>
  <text x="380" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Trẻ 9–14 tuổi</text>
  <text x="380" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">Vắc-xin HPV</text>
  <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Cả bé gái và bé trai</text>

  <!-- thẻ 3: người lớn — xét nghiệm rồi tiêm bù (thẻ nhấn) -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <!-- ống nghiệm -->
  <rect x="578" y="50" width="40" height="105" rx="20" fill="#e8f1fa" stroke="#123b63" stroke-width="6"/>
  <path d="M584 105 H612 V135 a14 14 0 0 1 -28 0 Z" fill="#f26e21"/>
  <rect x="572" y="44" width="52" height="14" rx="7" fill="#123b63"/>
  <!-- dấu tích: rồi mới tiêm -->
  <circle cx="668" cy="118" r="26" fill="#f26e21"/>
  <path d="M656 118 l9 10 l16 -19" fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Người lớn</text>
  <text x="627" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">Xét nghiệm viêm gan B</text>
  <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Rồi hỏi về tiêm bù</text>
</svg>
