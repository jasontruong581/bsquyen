<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"
     aria-label="Ba chấm tròn lớn dần trên một trục thời gian, chấm lớn nhất có chuông cảnh báo phía trên">
  <rect width="760" height="440" fill="#fff9f4"/>
  <circle cx="690" cy="380" r="110" fill="#fdeee2"/>
  <circle cx="70" cy="65" r="80" fill="#e8f1fa"/>

  <!-- chuông cảnh báo trên mốc cuối -->
  <path d="M570 42 a42.5 42.5 0 0 1 42.5 42.5 v35 l15 22.5 h-115 l15 -22.5 v-35 a42.5 42.5 0 0 1 42.5 -42.5 Z"
        fill="#f26e21" stroke="#d85a10" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="570" cy="155" r="12" fill="#d85a10"/>

  <!-- trục thời gian -->
  <path d="M80 260 H640" stroke="#ecdfd3" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M640 236 l44 24 l-44 24 Z" fill="#ecdfd3"/>

  <!-- ba mốc: triệu chứng càng kéo dài, càng đáng chú ý -->
  <circle cx="170" cy="260" r="34" fill="#fdeee2" stroke="#f2a56e" stroke-width="6"/>
  <circle cx="170" cy="260" r="10" fill="#f2a56e"/>
  <circle cx="370" cy="260" r="44" fill="#f2a56e" stroke="#e08b4f" stroke-width="6"/>
  <circle cx="570" cy="260" r="56" fill="#f26e21" stroke="#d85a10" stroke-width="7"/>
  <circle cx="552" cy="242" r="12" fill="#ffd9bd"/>
</svg>
