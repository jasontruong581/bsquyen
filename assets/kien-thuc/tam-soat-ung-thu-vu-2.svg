<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Ba mốc tầm soát ung thư vú: dưới 40 tuổi cần biết vú mình bình thường thế nào và đi khám khi có thay đổi, từ 40 đến 74 tuổi chụp nhũ ảnh định kỳ mỗi 1 đến 2 năm, nhóm nguy cơ cao cần bàn với bác sĩ" font-family="'Be Vietnam Pro', system-ui, sans-serif">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- thẻ 1: dưới 40 tuổi -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- icon: ngón tay sờ khám -->
  <circle cx="133" cy="112" r="40" fill="none" stroke="#f2a56e" stroke-width="9"/>
  <g stroke="#d85a10" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M113 96 l-8 24"/>
    <path d="M133 89 l0 26"/>
    <path d="M153 96 l8 24"/>
  </g>
  <circle cx="113" cy="96" r="8" fill="#f26e21"/>
  <circle cx="133" cy="89" r="8" fill="#f26e21"/>
  <circle cx="153" cy="96" r="8" fill="#f26e21"/>
  <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Dưới 40 tuổi</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Biết vú mình thế nào</text>
  <text x="133" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Khám khi có thay đổi</text>

  <!-- thẻ 2: 40-74 tuổi -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <!-- icon: nhũ ảnh — hai bản ép và mô tuyến ở giữa -->
  <rect x="335" y="70" width="90" height="14" rx="7" fill="#123b63"/>
  <rect x="335" y="130" width="90" height="14" rx="7" fill="#123b63"/>
  <ellipse cx="380" cy="107" rx="36" ry="15" fill="#f2a56e" stroke="#e08b4f" stroke-width="3"/>
  <circle cx="367" cy="107" r="6" fill="#f26e21"/>
  <text x="380" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">40 – 74 tuổi</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Chụp nhũ ảnh định kỳ</text>
  <text x="380" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Mỗi 1–2 năm</text>

  <!-- thẻ 3: nguy cơ cao (thẻ nhấn) -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <!-- icon: cây gia đình (tiền sử) -->
  <path d="M605 80 h44" stroke="#d85a10" stroke-width="6" stroke-linecap="round"/>
  <circle cx="605" cy="80" r="17" fill="#f26e21"/>
  <circle cx="649" cy="80" r="17" fill="#f26e21"/>
  <path d="M627 97 v32" stroke="#d85a10" stroke-width="6" stroke-linecap="round"/>
  <circle cx="627" cy="145" r="15" fill="#f2a56e" stroke="#d85a10" stroke-width="4"/>
  <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Nguy cơ cao</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Tiền sử gia đình, BRCA</text>
  <text x="627" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Bàn với bác sĩ</text>

  <text x="380" y="313" text-anchor="middle" font-size="12" fill="#5b6b7b">*Mốc tuổi theo USPSTF 2024 và Hiệp hội Ung thư Hoa Kỳ</text>
</svg>
