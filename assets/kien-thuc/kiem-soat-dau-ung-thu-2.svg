<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" font-family="'Be Vietnam Pro', system-ui, sans-serif" aria-label="Ba nguyên tắc dùng thuốc giảm đau theo WHO: ưu tiên đường uống, uống đúng giờ cố định thay vì chờ đau, và liều điều chỉnh riêng cho từng người bệnh">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- thẻ 1: đường uống -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3" stroke-width="3"/>
  <g transform="rotate(-20 133 107)">
    <rect x="88" y="85" width="90" height="44" rx="22" fill="#f26e21" stroke="#d85a10" stroke-width="5"/>
    <path d="M133 85 V129" stroke="#d85a10" stroke-width="5"/>
  </g>
  <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Theo đường uống</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Đơn giản, dùng tại nhà</text>
  <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Dễ duy trì đều</text>

  <!-- thẻ 2: đúng giờ -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3" stroke-width="3"/>
  <circle cx="380" cy="105" r="44" fill="#ffffff" stroke="#123b63" stroke-width="8"/>
  <path d="M380 105 V76" stroke="#f26e21" stroke-width="7" stroke-linecap="round"/>
  <path d="M380 105 L404 118" stroke="#f26e21" stroke-width="7" stroke-linecap="round"/>
  <circle cx="380" cy="105" r="5" fill="#123b63"/>
  <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Đúng giờ cố định</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Không chờ đau mới uống</text>
  <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Đau ít bùng lên</text>

  <!-- thẻ 3: cá thể hoá — thẻ được nhấn -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e" stroke-width="3"/>
  <circle cx="612" cy="80" r="20" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
  <path d="M582 146 a30 34 0 0 1 60 0 Z" fill="#f26e21" stroke="#d85a10" stroke-width="4" stroke-linejoin="round"/>
  <path d="M676 66 V146" stroke="#f2a56e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="676" cy="98" r="10" fill="#d85a10"/>
  <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Theo từng người</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Bác sĩ điều chỉnh dần</text>
  <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Không tự tăng liều</text>

  <text x="380" y="313" text-anchor="middle" font-size="12" fill="#5b6b7b">*Ba trong các nguyên tắc dùng thuốc giảm đau ung thư của WHO</text>
</svg>
