<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" font-family="'Be Vietnam Pro', system-ui, sans-serif" aria-label="Ba tiêu chí tầm soát ung thư phổi: từ 50 đến 80 tuổi, từ 20 gói-năm trở lên kể cả đã bỏ thuốc, chụp CT ngực liều thấp mỗi năm một lần">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Thẻ 1: tuổi -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <circle cx="133" cy="104" r="46" fill="none" stroke="#f2a56e" stroke-width="10"/>
  <text x="133" y="114" text-anchor="middle" font-size="30" font-weight="800" fill="#f26e21">50+</text>
  <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Từ 50–80 tuổi</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Nam hay nữ đều áp dụng</text>
  <text x="133" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Tiêu chí 1</text>

  <!-- Thẻ 2: gói-năm (điếu thuốc) -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <g fill="none" stroke="#5b6b7b" stroke-width="5" stroke-linecap="round" opacity=".45">
    <path d="M438 90 q-12 -14 0 -28 q12 -14 0 -28"/>
    <path d="M422 88 q-9 -10 0 -20 q9 -10 0 -20"/>
  </g>
  <rect x="315" y="100" width="130" height="24" rx="6" fill="#ffffff" stroke="#123b63" stroke-width="5"/>
  <rect x="317.5" y="102.5" width="34" height="19" fill="#f2a56e"/>
  <rect x="433" y="102.5" width="9.5" height="19" fill="#f26e21"/>
  <text x="380" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">≥ 20 gói-năm</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Đang hút hoặc đã bỏ</text>
  <text x="380" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Tiêu chí 2</text>

  <!-- Thẻ 3: chụp CT (được nhấn) -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <circle cx="627" cy="102" r="52" fill="#ffffff" stroke="#123b63" stroke-width="14"/>
  <ellipse cx="610" cy="106" rx="14" ry="24" fill="#f2a56e" stroke="#e08b4f" stroke-width="3"/>
  <ellipse cx="644" cy="106" rx="14" ry="24" fill="#f2a56e" stroke="#e08b4f" stroke-width="3"/>
  <circle cx="606" cy="100" r="6" fill="#f26e21" stroke="#d85a10" stroke-width="3"/>
  <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">CT liều thấp</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Không đau, vài phút</text>
  <text x="627" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Mỗi năm 1 lần</text>
</svg>
