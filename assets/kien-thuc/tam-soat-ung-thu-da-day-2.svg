<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Ba nhóm nên cân nhắc tầm soát ung thư dạ dày: người nhiễm vi khuẩn HP, người từ 40 tuổi có lối sống nguy cơ, người có tiền sử gia đình hoặc bệnh dạ dày mạn" font-family="'Be Vietnam Pro', system-ui, sans-serif">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Cột 1: Nhiễm HP -->
  <g>
    <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- vi khuẩn HP xoắn -->
    <path d="M108 70 q28 12 0 26 q-28 14 0 28 q28 14 0 28" fill="none" stroke="#f26e21" stroke-width="12" stroke-linecap="round"/>
    <g stroke="#d85a10" stroke-width="6" stroke-linecap="round">
      <path d="M112 66 l16 -12"/><path d="M124 96 l18 -6"/>
      <path d="M112 122 l16 12"/><path d="M124 152 l18 6"/>
    </g>
    <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Nhiễm vi khuẩn HP</text>
    <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Helicobacter pylori</text>
    <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Nên xét nghiệm &amp; điều trị</text>
  </g>

  <!-- Cột 2: Tuổi 40+ và lối sống -->
  <g>
    <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- vòng tuổi 40+ -->
    <circle cx="380" cy="108" r="42" fill="none" stroke="#f2a56e" stroke-width="10"/>
    <text x="380" y="118" text-anchor="middle" font-size="30" font-weight="800" fill="#f26e21">40+</text>
    <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Từ 40 tuổi</text>
    <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">ăn mặn, hút thuốc, rượu bia</text>
    <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Trao đổi với bác sĩ</text>
  </g>

  <!-- Cột 3: Tiền sử -->
  <g>
    <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
    <!-- cây gia đình đơn giản -->
    <circle cx="600" cy="80" r="16" fill="#f26e21"/>
    <circle cx="654" cy="80" r="16" fill="#f26e21"/>
    <path d="M600 96 v18 h54 v-18 M627 114 v22" fill="none" stroke="#d85a10" stroke-width="6" stroke-linecap="round"/>
    <circle cx="627" cy="150" r="14" fill="#f2a56e"/>
    <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Tiền sử nguy cơ</text>
    <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">gia đình, viêm teo, dị sản ruột</text>
    <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Cần tầm soát sớm</text>
  </g>
</svg>
