<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img"
     font-family="'Be Vietnam Pro', system-ui, sans-serif"
     aria-label="Ba bước tìm nguyên nhân đi cầu ra máu: hỏi bệnh sử, khám và soi hậu môn trực tràng, nội soi đại tràng">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Thẻ 1: hỏi bệnh sử -->
  <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <rect x="88" y="55" width="90" height="68" rx="16" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
  <path d="M108 121 V145 L134 121" fill="#f26e21" stroke="#d85a10" stroke-width="4" stroke-linejoin="round"/>
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <path d="M104 78 H162"/>
    <path d="M104 92 H162"/>
    <path d="M104 106 H140"/>
  </g>
  <text x="133" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Hỏi bệnh sử</text>
  <text x="133" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Máu ra khi nào, bao lâu</text>
  <text x="133" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Bước đầu tiên</text>

  <!-- Thẻ 2: khám và soi hậu môn - trực tràng -->
  <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
  <circle cx="372" cy="98" r="38" fill="#ffffff" stroke="#123b63" stroke-width="8"/>
  <circle cx="372" cy="98" r="14" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
  <path d="M398 124 L424 150" stroke="#123b63" stroke-width="14" stroke-linecap="round"/>
  <text x="380" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Khám hậu môn</text>
  <text x="380" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Soi trực tràng tại chỗ</text>
  <text x="380" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Nhanh, ít khó chịu</text>

  <!-- Thẻ 3 (nhấn): nội soi đại tràng -->
  <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
  <path d="M582 152 C582 78 672 78 672 152" fill="none" stroke="#e08b4f" stroke-width="34" stroke-linecap="round"/>
  <path d="M582 152 C582 78 672 78 672 152" fill="none" stroke="#f2a56e" stroke-width="26" stroke-linecap="round"/>
  <path d="M627 154 V104" stroke="#123b63" stroke-width="10" stroke-linecap="round"/>
  <path d="M627 104 L657 112 L640 128 Z" fill="#ffd9bd" opacity=".9"/>
  <circle cx="659" cy="117" r="9" fill="#f26e21" stroke="#d85a10" stroke-width="4"/>
  <text x="627" y="205" text-anchor="middle" font-size="21" font-weight="700" fill="#123b63">Nội soi đại tràng</text>
  <text x="627" y="235" text-anchor="middle" font-size="16" fill="#5b6b7b">Nhìn trực tiếp niêm mạc</text>
  <text x="627" y="272" text-anchor="middle" font-size="17" font-weight="700" fill="#d85a10">Có gây mê nhẹ</text>
</svg>
