<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" role="img" aria-label="Ba lựa chọn: xét nghiệm FIT mỗi năm, nội soi đại tràng mỗi 10 năm, có dấu hiệu thì khám ngay" font-family="'Be Vietnam Pro', system-ui, sans-serif">
  <rect width="760" height="320" fill="#fff9f4"/>

  <!-- Cột 1: FIT -->
  <g>
    <rect x="20" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- ống nghiệm -->
    <rect x="113" y="55" width="40" height="105" rx="20" fill="#e8f1fa" stroke="#123b63" stroke-width="6"/>
    <path d="M119 110 h28 v29 a14 14 0 0 1 -28 0 Z" fill="#f26e21"/>
    <rect x="107" y="47" width="52" height="14" rx="7" fill="#123b63"/>
    <text x="133" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Xét nghiệm FIT</text>
    <text x="133" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">máu ẩn trong phân</text>
    <text x="133" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Mỗi năm 1 lần</text>
  </g>

  <!-- Cột 2: Nội soi -->
  <g>
    <rect x="267" y="20" width="226" height="280" rx="18" fill="#ffffff" stroke="#ecdfd3"/>
    <!-- ống soi mềm -->
    <path d="M320 140 q30 -70 90 -60 q55 10 45 55 q-9 42 -55 38"
          fill="none" stroke="#123b63" stroke-width="14" stroke-linecap="round"/>
    <circle cx="320" cy="140" r="17" fill="#f26e21" stroke="#d85a10" stroke-width="5"/>
    <circle cx="315" cy="135" r="5" fill="#ffd9bd"/>
    <text x="380" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Nội soi đại tràng</text>
    <text x="380" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">tiêu chuẩn vàng, cắt polyp</text>
    <text x="380" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">~10 năm 1 lần*</text>
  </g>

  <!-- Cột 3: Có dấu hiệu -->
  <g>
    <rect x="514" y="20" width="226" height="280" rx="18" fill="#fdeee2" stroke="#f2a56e"/>
    <!-- chuông cảnh báo -->
    <path d="M627 60 a34 34 0 0 1 34 34 v28 l12 18 h-92 l12 -18 v-28 a34 34 0 0 1 34 -34 Z"
          fill="#f26e21" stroke="#d85a10" stroke-width="5"/>
    <circle cx="627" cy="152" r="10" fill="#d85a10"/>
    <text x="627" y="205" text-anchor="middle" font-size="22" font-weight="700" fill="#123b63">Có dấu hiệu?</text>
    <text x="627" y="235" text-anchor="middle" font-size="17" fill="#5b6b7b">tiêu máu, sụt cân, đau kéo dài</text>
    <text x="627" y="272" text-anchor="middle" font-size="18" font-weight="700" fill="#d85a10">Khám ngay, không đợi</text>
  </g>

  <text x="380" y="313" text-anchor="middle" font-size="12" fill="#5b6b7b">*khi kết quả bình thường và nguy cơ trung bình — bác sĩ sẽ hẹn lịch cụ thể theo kết quả của bạn</text>
</svg>
